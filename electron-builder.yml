appId: online.tryrevive.desktop
productName: TryRevive
copyright: Copyright 2026 TryRevive
asar: true
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**
  - package.json
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
