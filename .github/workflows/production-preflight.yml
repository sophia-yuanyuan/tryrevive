name: Production control-plane preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: tryrevive-production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Verify DNS ownership, HTTPS, API, model, and payment gates
        run: npm run verify:production
        env:
          TRYREVIVE_DOMAIN_VERIFICATION_TOKEN: "${{ secrets.TRYREVIVE_DOMAIN_VERIFICATION_TOKEN }}"
