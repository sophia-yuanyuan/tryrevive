name: Remote cloud acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_staging_usage:
        description: This run consumes at least 4 project analyses and 1 speech minute
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - I_ACCEPT_REMOTE_E2E_USAGE

permissions:
  contents: read

jobs:
  staging-cloud:
    if: inputs.confirm_staging_usage == 'I_ACCEPT_REMOTE_E2E_USAGE'
    runs-on: windows-latest
    environment: tryrevive-staging
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Create synthetic voice, PDF, and DOCX fixtures
        shell: powershell
        run: >-
          ./scripts/create-remote-e2e-fixtures.ps1
          -OutputDirectory "${{ runner.temp }}\tryrevive-remote-fixtures"
      - name: Run real staging protocol acceptance
        run: npm run test:e2e:remote-cloud
        env:
          TRYREVIVE_REMOTE_E2E: "1"
          TRYREVIVE_REMOTE_BASE_URL: "https://tryrevive-cloud-staging.tryrevive.workers.dev"
          TRYREVIVE_REMOTE_FIXTURE_DIR: "${{ runner.temp }}\tryrevive-remote-fixtures"
          TRYREVIVE_REMOTE_FUNDED_SESSION: "${{ secrets.TRYREVIVE_REMOTE_FUNDED_SESSION }}"
          TRYREVIVE_REMOTE_INSUFFICIENT_SESSION: "${{ secrets.TRYREVIVE_REMOTE_INSUFFICIENT_SESSION }}"
