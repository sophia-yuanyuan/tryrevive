version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      vue-toolchain:
        patterns:
          - "vue*"
          - "@vue/*"
          - "vite"
          - "@vitejs/*"
      test-toolchain:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
      electron-toolchain:
        patterns:
          - "electron"
          - "electron-*"
