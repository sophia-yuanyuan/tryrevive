name = "tryrevive-cloud"
main = "cloud-service.js"
compatibility_date = "2026-08-07"

[vars]
CLOUD_DEPLOYMENT_ENVIRONMENT = "disabled"
CLOUD_PROVIDER_ENABLED = "false"
OPENAI_MODEL_REVIEW_ENABLED = "false"
OPENAI_MODEL_APPROVED = "false"
OPENAI_ANALYSIS_MODEL = "REPLACE_WITH_APPROVED_MODEL"
OPENAI_REASONING_EFFORT = "medium"
OPENAI_TRANSCRIPTION_MODEL = "gpt-4o-mini-transcribe"
CLOUD_LIMIT_ACCOUNT_PER_MINUTE = "REPLACE_WITH_POSITIVE_INTEGER"
CLOUD_LIMIT_SESSION_PER_MINUTE = "REPLACE_WITH_POSITIVE_INTEGER"
CLOUD_LIMIT_ACCOUNT_DAILY_ANALYSES = "REPLACE_WITH_POSITIVE_INTEGER"
CLOUD_LIMIT_ACCOUNT_DAILY_SPEECH_MINUTES = "REPLACE_WITH_POSITIVE_INTEGER"
CLOUD_LIMIT_GLOBAL_DAILY_ANALYSES = "REPLACE_WITH_POSITIVE_INTEGER"
CLOUD_LIMIT_GLOBAL_DAILY_SPEECH_MINUTES = "REPLACE_WITH_POSITIVE_INTEGER"
CLOUD_PAYMENT_ENABLED = "false"
CLOUD_PAYMENT_LIVE_ENABLED = "false"
STRIPE_PACKAGES_JSON = "REPLACE_WITH_REVIEWED_STRIPE_PACKAGES_JSON"
STRIPE_SUCCESS_URL = "https://tryrevive.online/#/payment/success?session_id={CHECKOUT_SESSION_ID}"
STRIPE_CANCEL_URL = "https://tryrevive.online/#/payment/canceled"

# OPENAI_API_KEY, OPENAI_MODEL_REVIEW_ACCESS_TOKEN, STRIPE_SECRET_KEY and
# STRIPE_WEBHOOK_SECRET must be configured as Wrangler secrets, never committed here.

[[d1_databases]]
binding = "CLOUD_DB"
database_name = "tryrevive-cloud"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["*/10 * * * *"]
